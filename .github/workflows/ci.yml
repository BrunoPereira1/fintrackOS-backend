name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, testes unitários e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint:check
      - run: npm run typecheck
      - run: npm test -- --ci
      - run: npm run build

  e2e:
    name: Migrations e testes e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fintrack
          POSTGRES_PASSWORD: fintrack_ci
          POSTGRES_DB: fintrack_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fintrack -d fintrack_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: fintrack
      DB_PASSWORD: fintrack_ci
      DB_NAME: fintrack_db
      REDIS_HOST: localhost
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Init SQL (extensões)
        run: PGPASSWORD=$DB_PASSWORD psql -h localhost -U fintrack -d fintrack_db -f docker/postgres/init.sql
      - name: Aplicar migrations
        run: npm run migration:run
      - name: Reverter e reaplicar a última migration
        run: npm run migration:revert && npm run migration:run
      - name: Verificar drift entre entities e migrations
        run: npm run migration:check
      - run: npm run test:e2e -- --ci
